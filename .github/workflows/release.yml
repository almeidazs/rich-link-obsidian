name: Release

on:
    push:
        tags:
            - '*.*.*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Validate release metadata
              env:
                  EXPECTED_VERSION: ${{ github.ref_name }}
              run: |
                  node --input-type=module -e '
                    import fs from "node:fs";
                    const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
                    const pkg = read("package.json");
                    const manifest = read("manifest.json");
                    const versions = read("versions.json");
                    const errors = [];
                    if (pkg.version !== manifest.version) errors.push(`package.json version (${pkg.version}) does not match manifest.json version (${manifest.version})`);
                    if (versions[manifest.version] !== manifest.minAppVersion) errors.push(`versions.json entry for ${manifest.version} (${versions[manifest.version] ?? "missing"}) does not match manifest minAppVersion (${manifest.minAppVersion})`);
                    if (process.env.EXPECTED_VERSION && process.env.EXPECTED_VERSION !== manifest.version) errors.push(`Release tag (${process.env.EXPECTED_VERSION}) does not match manifest.json version (${manifest.version})`);
                    if (errors.length > 0) {
                      for (const error of errors) console.error(`::error::${error}`);
                      process.exit(1);
                    }
                    console.log(`Release version check passed for ${manifest.version}`);
                  '

            - name: Build
              run: npm run build

            - name: Create GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      main.js
                      manifest.json
                      styles.css
