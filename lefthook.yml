commit-msg:
    commands:
        commitlint:
            run: npx --no-install commitlint --edit {1}
pre-commit:
    parallel: false
    commands:
        format:
            glob: '*.{ts,mts,cts,js,mjs,cjs,json,jsonc,css,md,yml,yaml}'
            run: npx --no-install oxfmt {staged_files}
            stage_fixed: true
        lint:
            glob: '*.{ts,mts,cts,js,mjs,cjs}'
            run: npx --no-install oxlint {staged_files}
        types:
            run: npm run typecheck
        test:
            run: npm test
pre-push:
    parallel: false
    commands:
        types:
            run: npm run typecheck
        test:
            run: npm test
